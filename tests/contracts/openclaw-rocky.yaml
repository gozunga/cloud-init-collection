# Contract: OpenClaw on Rocky Linux
name: openclaw-rocky
example: ai/rocky-openclaw.yaml
image: rocky-10
flavor: gp.small1
network: Internet
keypair: openclaw-chester
security_group: cloudinit-smoke
ssh_user: rocky
probe: openclaw
cloud_init_timeout_seconds: 600
expect:
  - cloud-init status succeeds
  - openclaw binary is installed and returns version
