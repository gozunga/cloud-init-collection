#cloud-config
# vLLM + Open WebUI on Ubuntu with NVIDIA GPU support
#
# Installs NVIDIA open-kernel drivers, NVIDIA Container Toolkit, Docker CE,
# and brings up vLLM + Open WebUI via Docker Compose.
#
# vLLM serves an OpenAI-compatible API on port 8000; Open WebUI connects to it
# as its backend and is available on port 3000.
#
# Default model: Qwen/Qwen3.6-27B-FP8 (~28 GB VRAM)
# Requires a 40+ GB GPU — recommended: ac.nvl40s1 (48 GB L40S) or larger.
# Context is capped at 131072 on a single L40S (48 GB) — after loading the FP8 weights
# (~28 GB) only ~18 GB remains, which limits KV cache to ~128K tokens.
# For full 262K context, use 2x L40S with --tensor-parallel-size 2.
# For smaller GPUs (16 GB), swap to an AWQ/GPTQ quantized 7B model.
# To use a different model, edit the `command` block in /opt/vllm/docker-compose.yml.
# For gated models (Llama, Mistral, etc.), uncomment HF_TOKEN
# in /opt/vllm/.env and add your token before starting the service.
#
# Note: first startup downloads the model (~27 GB) and captures CUDA graphs.
# Allow 5-10 minutes for vLLM to become ready before Open WebUI will show models.
#
# After boot (including driver reboot):
#   Open WebUI: http://<server-ip>:3000
#   vLLM API:   http://<server-ip>:8000/v1  (OpenAI-compatible)
#
# Required security group ports:
#   - 22   (SSH — management)
#   - 3000 (Open WebUI)
#   - 8000 (vLLM API — optional, for direct API access)
#
# Recommended: ac.nvl40s1 (48 GB L40S) or ac.nvl40s2 (2x L40S)
# Tested on: Ubuntu 26.04 LTS

bootcmd:
  - |
    for f in /etc/apt/sources.list.d/ubuntu.sources /etc/apt/sources.list; do
      [ -f "$f" ] && sed -i \
        -e 's|https\?://archive\.ubuntu\.com/ubuntu|https://mirror.gozunga.com/ubuntu|g' \
        -e 's|https\?://security\.ubuntu\.com/ubuntu|https://mirror.gozunga.com/ubuntu|g' \
        -e 's|https\?://ports\.ubuntu\.com/ubuntu-ports|https://mirror.gozunga.com/ubuntu|g' \
        "$f" || true
    done

apt:
  primary:
    - arches: [default]
      uri: https://mirror.gozunga.com/ubuntu
  security:
    - arches: [default]
      uri: https://mirror.gozunga.com/ubuntu

package_update: true
package_upgrade: true

packages:
  - curl
  - ca-certificates

write_files:
  - path: /etc/modprobe.d/blacklist-nouveau.conf
    permissions: '0644'
    content: |
      blacklist nouveau
      blacklist lbm-nouveau
      options nouveau modeset=0
      alias nouveau off
      alias lbm-nouveau off

  - path: /opt/vllm/.env
    permissions: '0600'
    content: |
      # Uncomment and set your HuggingFace token for gated models (Llama, Mistral, etc.)
      # HF_TOKEN=hf_your_token_here

  - path: /opt/vllm/docker-compose.yml
    permissions: '0644'
    content: |
      services:
        vllm:
          image: vllm/vllm-openai:latest
          container_name: vllm
          restart: unless-stopped
          ports:
            - "8000:8000"
          volumes:
            - huggingface:/root/.cache/huggingface
          env_file: .env
          # Change --model to any HuggingFace model ID.
          # Qwen3.6-27B-FP8 (~27 GB) fits on a single 40+ GB GPU (L40S, H100, H200).
          # For 2x L40S, add: --tensor-parallel-size 2
          # For smaller GPUs (16 GB), use an AWQ/GPTQ quantized 7B model instead.
          command:
            - "--model"
            - "Qwen/Qwen3.6-27B-FP8"
            - "--trust-remote-code"
            - "--max-num-seqs"
            - "180"
            - "--tensor-parallel-size"
            - "1"
            - "--enable-auto-tool-choice"
            - "--tool-call-parser"
            - "qwen3_coder"
            - "--reasoning-parser"
            - "qwen3"
            - "--mm-encoder-tp-mode"
            - "data"
            - "--max-model-len"
            - "131072"
          deploy:
            resources:
              reservations:
                devices:
                  - driver: nvidia
                    count: all
                    capabilities: [gpu]
          ipc: host
          healthcheck:
            test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
            interval: 30s
            timeout: 10s
            retries: 10
            start_period: 120s

        open-webui:
          image: ghcr.io/open-webui/open-webui:main
          container_name: open-webui
          restart: unless-stopped
          ports:
            - "3000:8080"
          volumes:
            - open-webui:/app/backend/data
          environment:
            - OPENAI_API_BASE_URL=http://vllm:8000/v1
            - OPENAI_API_KEY=vllm
            - ENABLE_OLLAMA_API=false
          depends_on:
            vllm:
              condition: service_healthy

      volumes:
        huggingface:
        open-webui:

  - path: /etc/systemd/system/vllm-webui.service
    permissions: '0644'
    content: |
      [Unit]
      Description=vLLM + Open WebUI (Docker Compose)
      Documentation=https://docs.vllm.ai https://openwebui.com
      After=docker.service network-online.target
      Requires=docker.service

      [Service]
      Type=oneshot
      RemainAfterExit=yes
      WorkingDirectory=/opt/vllm
      ExecStart=/usr/bin/docker compose up -d
      ExecStop=/usr/bin/docker compose down
      TimeoutStartSec=600
      Restart=on-failure

      [Install]
      WantedBy=multi-user.target

runcmd:
  - update-initramfs -u
  - add-apt-repository ppa:graphics-drivers/ppa -y
  - apt-get update -y
  - apt-get install -y nvidia-driver-595-server-open nvtop

  # Docker CE — official repository
  - |
    set -e
    install -m 0755 -d /etc/apt/keyrings
    curl -fsSL https://download.docker.com/linux/ubuntu/gpg -o /etc/apt/keyrings/docker.asc
    chmod a+r /etc/apt/keyrings/docker.asc
    . /etc/os-release
    cat > /etc/apt/sources.list.d/docker.sources <<SRC
    Types: deb
    URIs: https://download.docker.com/linux/ubuntu
    Suites: ${UBUNTU_CODENAME:-$VERSION_CODENAME}
    Components: stable
    Architectures: $(dpkg --print-architecture)
    Signed-By: /etc/apt/keyrings/docker.asc
    SRC
    sed -i 's/^[[:space:]]\+//' /etc/apt/sources.list.d/docker.sources
    apt-get update -y
    DEBIAN_FRONTEND=noninteractive apt-get install -y \
      docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin
    systemctl enable docker

  # NVIDIA Container Toolkit — for GPU passthrough into Docker
  - |
    set -e
    curl -fsSL https://nvidia.github.io/libnvidia-container/gpgkey \
      | gpg --dearmor -o /usr/share/keyrings/nvidia-container-toolkit-keyring.gpg
    curl -s -L https://nvidia.github.io/libnvidia-container/stable/deb/nvidia-container-toolkit.list \
      | sed 's#deb https://#deb [signed-by=/usr/share/keyrings/nvidia-container-toolkit-keyring.gpg] https://#g' \
      | tee /etc/apt/sources.list.d/nvidia-container-toolkit.list
    apt-get update -y
    apt-get install -y nvidia-container-toolkit
    nvidia-ctk runtime configure --runtime=docker

  # Enable Compose service — starts automatically after reboot
  - systemctl daemon-reload
  - systemctl enable vllm-webui

power_state:
  mode: reboot
  message: "Rebooting to load NVIDIA drivers — vLLM + Open WebUI will start on next boot"
  timeout: 1

final_message: |
  NVIDIA drivers installed. Rebooting to load kernel module.
  After reboot, vLLM will start and download the model (allow several minutes).
  Open WebUI: http://<server-ip>:3000
  vLLM API:   http://<server-ip>:8000/v1
