#cloud-config
# vLLM-Omni on Ubuntu with NVIDIA GPU support
# Model: Qwen/Qwen-Image-2.1 (official weights)
#
# Installs NVIDIA open-kernel drivers, NVIDIA Container Toolkit, Docker CE,
# and brings up vLLM-Omni via Docker Compose.
#
# vLLM-Omni pulls one Hugging Face repository and serves an OpenAI-compatible
# image API on port 8000. The page on port 3000 creates images and can attach
# up to four reference images. Edits use POST /v1/images/edits as a file upload.
# https://recipes.vllm.ai/Qwen/Qwen-Image-2.1
#
# Model: Qwen/Qwen-Image-2.1
# https://huggingface.co/Qwen/Qwen-Image-2.1
# Serve command: https://recipes.vllm.ai/Qwen/Qwen-Image-2.1
#   vllm serve Qwen/Qwen-Image-2.1 --omni --port 8000
# Image: vllm/vllm-omni:qwen-image21
# That image has an empty entrypoint, so the compose command is the full
# `vllm serve` line.
#
# Weights are about 33 GB. Peak GPU memory for a 1024 px image is about 34-40 GB.
# Recommended: ac.nvl40s1 (48 GB L40S) or larger.
#
# License: Qwen Research License. Commercial use needs a separate agreement.
# For gated models (Llama, Mistral, etc.), uncomment HF_TOKEN
# in /opt/vllm/.env and add your token before starting the service.
#
# Note: first startup downloads the model (about 33 GB).
# Allow 10-20 minutes after the driver reboot before :8000/health is ready.
#
# After boot (including driver reboot):
#   Browser:   http://<server-ip>:3000
#   Image API: http://<server-ip>:8000/v1/images/generations
#
# Example:
#   curl -X POST http://<server-ip>:8000/v1/images/generations \
#     -H "Content-Type: application/json" \
#     -d '{"model":"Qwen/Qwen-Image-2.1","prompt":"A ceramic teapot on a wooden table","size":"1024x1024","num_inference_steps":40,"true_cfg_scale":1.0,"seed":42}'
#
# Required security group ports:
#   - 22   (SSH — management)
#   - 3000 (image page)
#   - 8000 (vLLM-Omni image API)
#
# Recommended: ac.nvl40s1 (48 GB L40S) or larger
# Tested on: Ubuntu 26.04 LTS

bootcmd:
  - |
    for f in /etc/apt/sources.list.d/ubuntu.sources /etc/apt/sources.list; do
      [ -f "$f" ] && sed -i \
        -e 's|https\?://archive\.ubuntu\.com/ubuntu|https://mirror.gozunga.com/ubuntu|g' \
        -e 's|https\?://security\.ubuntu\.com/ubuntu|https://mirror.gozunga.com/ubuntu|g' \
        -e 's|https\?://ports\.ubuntu\.com/ubuntu-ports|https://mirror.gozunga.com/ubuntu|g' \
        "$f" || true
    done

apt:
  primary:
    - arches: [default]
      uri: https://mirror.gozunga.com/ubuntu
  security:
    - arches: [default]
      uri: https://mirror.gozunga.com/ubuntu

package_update: true
package_upgrade: true

packages:
  - curl
  - ca-certificates

write_files:
  - path: /etc/modprobe.d/blacklist-nouveau.conf
    permissions: '0644'
    content: |
      blacklist nouveau
      blacklist lbm-nouveau
      options nouveau modeset=0
      alias nouveau off
      alias lbm-nouveau off

  - path: /opt/vllm/.env
    permissions: '0600'
    content: |
      # Uncomment and set your HuggingFace token for gated models (Llama, Mistral, etc.)
      # HF_TOKEN=hf_your_token_here

  - path: /opt/vllm/docker-compose.yml
    permissions: '0644'
    content: |
      services:
        vllm:
          image: vllm/vllm-omni:qwen-image21
          container_name: vllm
          restart: unless-stopped
          ports:
            - "8000:8000"
          volumes:
            - huggingface:/root/.cache/huggingface
          env_file: .env
          # One model id. vLLM-Omni downloads Qwen/Qwen-Image-2.1 on first start.
          # https://huggingface.co/Qwen/Qwen-Image-2.1
          command:
            - "vllm"
            - "serve"
            - "Qwen/Qwen-Image-2.1"
            - "--omni"
            - "--host"
            - "0.0.0.0"
            - "--port"
            - "8000"
          deploy:
            resources:
              reservations:
                devices:
                  - driver: nvidia
                    count: all
                    capabilities: [gpu]
          ipc: host
          healthcheck:
            test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
            interval: 30s
            timeout: 10s
            retries: 20
            start_period: 600s

        web:
          image: nginx:1.30.5-alpine
          container_name: qwen-image-web
          restart: unless-stopped
          ports:
            - "3000:3000"
          volumes:
            - ./web/index.html:/usr/share/nginx/html/index.html:ro
            - ./web/nginx.conf:/etc/nginx/conf.d/default.conf:ro
          depends_on:
            - vllm

      volumes:
        huggingface:

  - path: /opt/vllm/web/nginx.conf
    permissions: '0644'
    content: |
      server {
          listen 3000;
          server_name _;
          root /usr/share/nginx/html;
          client_max_body_size 32m;

          location / {
              try_files $uri /index.html;
          }

          location = /health {
              proxy_pass http://vllm:8000/health;
              proxy_read_timeout 30s;
          }

          location /v1/ {
              proxy_pass http://vllm:8000;
              proxy_http_version 1.1;
              proxy_read_timeout 600s;
              proxy_send_timeout 600s;
          }
      }

  - path: /opt/vllm/web/index.html
    permissions: '0644'
    content: |
      <!DOCTYPE html>
      <html lang="en">
      <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Qwen-Image-2.1</title>
        <style>
          :root {
            color-scheme: dark;
            --bg: #12110f;
            --panel: #1b1916;
            --ink: #f4efe6;
            --muted: #b7ab9b;
            --line: #3a342c;
            --accent: #e2a15a;
            --accent-ink: #1c1308;
          }
          * { box-sizing: border-box; }
          body {
            margin: 0;
            background: var(--bg);
            color: var(--ink);
            font-family: "Segoe UI", sans-serif;
          }
          header {
            display: flex;
            justify-content: space-between;
            gap: 1rem;
            align-items: center;
            padding: 1rem 1.4rem;
            border-bottom: 1px solid var(--line);
          }
          h1 { font-size: 1.15rem; margin: 0; font-weight: 650; }
          header p { margin: 0.2rem 0 0; color: var(--muted); font-size: 0.92rem; }
          main {
            display: grid;
            grid-template-columns: minmax(20rem, 28rem) 1fr;
            min-height: calc(100vh - 4.6rem);
          }
          .controls, .stage { padding: 1.2rem 1.4rem 2rem; }
          .stage { background: #0e0d0c; display: flex; flex-direction: column; gap: 0.8rem; }
          label { display: block; margin-top: 0.9rem; font-size: 0.92rem; }
          textarea, select, input {
            width: 100%;
            margin-top: 0.35rem;
            padding: 0.6rem 0.7rem;
            color: inherit;
            background: #241f1b;
            border: 1px solid var(--line);
            border-radius: 8px;
            font: inherit;
          }
          textarea { min-height: 8rem; resize: vertical; }
          .row { display: grid; grid-template-columns: 1fr 1fr; gap: 0.7rem; }
          button, .file-btn {
            font: inherit;
            border: 0;
            border-radius: 8px;
            cursor: pointer;
          }
          button.primary {
            width: 100%;
            margin-top: 1rem;
            padding: 0.7rem 1rem;
            background: var(--accent);
            color: var(--accent-ink);
            font-weight: 700;
          }
          button.primary:disabled { opacity: 0.55; cursor: wait; }
          button.ghost, .file-btn {
            background: transparent;
            color: var(--ink);
            border: 1px solid var(--line);
            padding: 0.45rem 0.7rem;
          }
          .actions { display: flex; gap: 0.5rem; flex-wrap: wrap; }
          .drop {
            margin-top: 0.4rem;
            padding: 1rem;
            text-align: center;
            border: 1px dashed #6a5d4e;
            border-radius: 10px;
            color: var(--muted);
          }
          .drop.over { border-color: var(--accent); color: var(--ink); }
          .refs, .history { display: flex; gap: 0.5rem; flex-wrap: wrap; margin-top: 0.6rem; }
          .thumb { position: relative; width: 76px; height: 76px; }
          .thumb img, .history button img {
            width: 76px;
            height: 76px;
            object-fit: cover;
            border-radius: 8px;
            display: block;
          }
          .thumb button {
            position: absolute;
            top: 2px;
            right: 2px;
            width: 1.3rem;
            height: 1.3rem;
            border-radius: 99px;
            background: #111;
            color: white;
          }
          .history button { padding: 0; background: transparent; }
          .canvas {
            min-height: 24rem;
            display: grid;
            place-items: center;
            border-radius: 12px;
            background-color: #171512;
            background-image:
              linear-gradient(45deg, #221f1b 25%, transparent 25%),
              linear-gradient(-45deg, #221f1b 25%, transparent 25%),
              linear-gradient(45deg, transparent 75%, #221f1b 75%),
              linear-gradient(-45deg, transparent 75%, #221f1b 75%);
            background-size: 28px 28px;
            background-position: 0 0, 0 14px, 14px -14px, -14px 0;
          }
          #result { max-width: 100%; max-height: 72vh; }
          #status { min-height: 1.4rem; color: var(--muted); }
          details { margin-top: 0.8rem; color: var(--muted); }
          @media (max-width: 860px) {
            main { grid-template-columns: 1fr; }
            header { align-items: flex-start; flex-direction: column; }
          }
        </style>
      </head>
      <body>
        <header>
          <div>
            <h1>Qwen-Image-2.1</h1>
            <p id="health">Checking the model.</p>
          </div>
          <div class="actions">
            <button class="ghost" id="use-result" type="button" disabled>Use result as reference</button>
            <button class="ghost" id="download" type="button" disabled>Download</button>
          </div>
        </header>
        <main>
          <form class="controls" id="form">
            <label>Prompt
              <textarea id="prompt" required>A ceramic teapot on a wooden table</textarea>
            </label>
            <label>Reference images
              <div class="drop" id="drop">Drop up to 4 images here, or choose files. Leave this empty to create a new image.</div>
              <input id="files" type="file" accept="image/*" multiple hidden>
              <button class="file-btn" id="pick" type="button">Choose images</button>
              <div class="refs" id="refs"></div>
            </label>
            <div class="row">
              <label>Size
                <select id="size">
                  <option value="1024x1024">1024 x 1024</option>
                  <option value="1280x720">1280 x 720</option>
                  <option value="720x1280">720 x 1280</option>
                  <option value="1536x1024">1536 x 1024</option>
                  <option value="1024x1536">1024 x 1536</option>
                  <option value="2048x2048">2048 x 2048</option>
                </select>
              </label>
              <label>Steps
                <input id="steps" type="number" min="1" max="80" value="40">
              </label>
            </div>
            <details>
              <summary>More settings</summary>
              <label>Negative prompt
                <textarea id="negative" placeholder="Optional. Used only when you want the model to avoid something."></textarea>
              </label>
              <label>Seed
                <input id="seed" type="number" min="0" placeholder="Leave empty for a new result each time">
              </label>
            </details>
            <button class="primary" id="go" type="submit">Generate</button>
            <p id="status"></p>
            <div class="history" id="history"></div>
          </form>
          <section class="stage">
            <div class="canvas"><img id="result" alt=""></div>
          </section>
        </main>
        <script>
          const health = document.querySelector("#health");
          const statusEl = document.querySelector("#status");
          const result = document.querySelector("#result");
          const refsEl = document.querySelector("#refs");
          const historyEl = document.querySelector("#history");
          const go = document.querySelector("#go");
          const downloadBtn = document.querySelector("#download");
          const useResultBtn = document.querySelector("#use-result");
          const refs = [];
          let currentUrl = "";

          function checkHealth() {
            fetch("/health").then(function (response) {
              health.textContent = response.ok
                ? "The model is ready."
                : "The model is still loading. Wait, then try again.";
            }).catch(function () {
              health.textContent = "The model is still loading. Wait, then try again.";
            });
          }
          checkHealth();
          setInterval(checkHealth, 10000);

          function renderRefs() {
            refsEl.replaceChildren();
            refs.forEach(function (item, index) {
              const wrap = document.createElement("div");
              wrap.className = "thumb";
              const image = document.createElement("img");
              image.src = item.url;
              image.alt = "Reference " + (index + 1);
              const remove = document.createElement("button");
              remove.type = "button";
              remove.textContent = "x";
              remove.addEventListener("click", function () {
                URL.revokeObjectURL(item.url);
                refs.splice(index, 1);
                renderRefs();
              });
              wrap.append(image, remove);
              refsEl.append(wrap);
            });
          }

          function addFiles(fileList) {
            Array.from(fileList).forEach(function (file) {
              if (!file.type.startsWith("image/") || refs.length >= 4) return;
              refs.push({ file: file, url: URL.createObjectURL(file) });
            });
            renderRefs();
          }

          document.querySelector("#pick").addEventListener("click", function () {
            document.querySelector("#files").click();
          });
          document.querySelector("#files").addEventListener("change", function (event) {
            addFiles(event.target.files);
            event.target.value = "";
          });
          const drop = document.querySelector("#drop");
          drop.addEventListener("dragover", function (event) {
            event.preventDefault();
            drop.classList.add("over");
          });
          drop.addEventListener("dragleave", function () { drop.classList.remove("over"); });
          drop.addEventListener("drop", function (event) {
            event.preventDefault();
            drop.classList.remove("over");
            addFiles(event.dataTransfer.files);
          });

          function settings() {
            const negative = document.querySelector("#negative").value.trim();
            return {
              prompt: document.querySelector("#prompt").value,
              size: document.querySelector("#size").value,
              steps: String(document.querySelector("#steps").value),
              seed: document.querySelector("#seed").value.trim(),
              negative: negative,
              cfg: negative ? "4.0" : "1.0"
            };
          }

          function errorText(data) {
            return (data.error && data.error.message) || data.detail || JSON.stringify(data);
          }

          function showPicture(url, prompt) {
            currentUrl = url;
            result.src = url;
            result.alt = prompt;
            downloadBtn.disabled = false;
            useResultBtn.disabled = false;
            const button = document.createElement("button");
            button.type = "button";
            const image = document.createElement("img");
            image.src = url;
            image.alt = prompt;
            button.append(image);
            button.addEventListener("click", function () { showPicture(url, prompt); });
            historyEl.prepend(button);
            while (historyEl.children.length > 8) historyEl.lastElementChild.remove();
          }

          document.querySelector("#form").addEventListener("submit", async function (event) {
            event.preventDefault();
            const values = settings();
            go.disabled = true;
            const started = Date.now();
            const timer = setInterval(function () {
              statusEl.textContent = "Generating. " + Math.round((Date.now() - started) / 1000) + " s";
            }, 500);
            try {
              let response;
              if (refs.length) {
                const form = new FormData();
                refs.forEach(function (item) { form.append("image", item.file); });
                form.append("model", "Qwen/Qwen-Image-2.1");
                form.append("prompt", values.prompt);
                form.append("size", values.size);
                form.append("num_inference_steps", values.steps);
                form.append("true_cfg_scale", values.cfg);
                if (values.seed) form.append("seed", values.seed);
                if (values.negative) form.append("negative_prompt", values.negative);
                response = await fetch("/v1/images/edits", { method: "POST", body: form });
              } else {
                const body = {
                  model: "Qwen/Qwen-Image-2.1",
                  prompt: values.prompt,
                  size: values.size,
                  num_inference_steps: Number(values.steps),
                  true_cfg_scale: Number(values.cfg)
                };
                if (values.seed) body.seed = Number(values.seed);
                if (values.negative) body.negative_prompt = values.negative;
                response = await fetch("/v1/images/generations", {
                  method: "POST",
                  headers: { "Content-Type": "application/json" },
                  body: JSON.stringify(body)
                });
              }
              const data = await response.json();
              if (!response.ok) {
                statusEl.textContent = errorText(data);
                return;
              }
              const item = data.data && data.data[0];
              const url = item && item.b64_json
                ? "data:image/png;base64," + item.b64_json
                : (item && item.url) || "";
              if (!url) {
                statusEl.textContent = "The server returned no image.";
                return;
              }
              showPicture(url, values.prompt);
              statusEl.textContent = "Done.";
            } catch (error) {
              statusEl.textContent = "The request failed. The model may still be loading.";
            } finally {
              clearInterval(timer);
              go.disabled = false;
            }
          });

          downloadBtn.addEventListener("click", function () {
            const link = document.createElement("a");
            link.href = currentUrl;
            link.download = "qwen-image-2.1.png";
            link.click();
          });

          useResultBtn.addEventListener("click", async function () {
            const response = await fetch(currentUrl);
            const blob = await response.blob();
            addFiles([new File([blob], "result.png", { type: blob.type || "image/png" })]);
          });

          document.addEventListener("keydown", function (event) {
            if ((event.ctrlKey || event.metaKey) && event.key === "Enter") {
              document.querySelector("#form").requestSubmit();
            }
          });
        </script>
      </body>
      </html>

  - path: /etc/systemd/system/vllm-qwen-image.service
    permissions: '0644'
    content: |
      [Unit]
      Description=vLLM-Omni Qwen-Image-2.1 (Docker Compose)
      Documentation=https://recipes.vllm.ai/Qwen/Qwen-Image-2.1
      After=docker.service network-online.target
      Requires=docker.service

      [Service]
      Type=oneshot
      RemainAfterExit=yes
      WorkingDirectory=/opt/vllm
      ExecStart=/usr/bin/docker compose up -d
      ExecStop=/usr/bin/docker compose down
      TimeoutStartSec=600
      Restart=on-failure

      [Install]
      WantedBy=multi-user.target

runcmd:
  - update-initramfs -u
  - add-apt-repository ppa:graphics-drivers/ppa -y
  - apt-get update -y
  - apt-get install -y nvidia-driver-595-server-open nvtop

  # Docker CE — official repository
  - |
    set -e
    install -m 0755 -d /etc/apt/keyrings
    curl -fsSL https://download.docker.com/linux/ubuntu/gpg -o /etc/apt/keyrings/docker.asc
    chmod a+r /etc/apt/keyrings/docker.asc
    . /etc/os-release
    cat > /etc/apt/sources.list.d/docker.sources <<SRC
    Types: deb
    URIs: https://download.docker.com/linux/ubuntu
    Suites: ${UBUNTU_CODENAME:-$VERSION_CODENAME}
    Components: stable
    Architectures: $(dpkg --print-architecture)
    Signed-By: /etc/apt/keyrings/docker.asc
    SRC
    sed -i 's/^[[:space:]]\+//' /etc/apt/sources.list.d/docker.sources
    apt-get update -y
    DEBIAN_FRONTEND=noninteractive apt-get install -y \
      docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin
    systemctl enable docker

  # NVIDIA Container Toolkit — for GPU passthrough into Docker
  - |
    set -e
    curl -fsSL https://nvidia.github.io/libnvidia-container/gpgkey \
      | gpg --dearmor -o /usr/share/keyrings/nvidia-container-toolkit-keyring.gpg
    curl -s -L https://nvidia.github.io/libnvidia-container/stable/deb/nvidia-container-toolkit.list \
      | sed 's#deb https://#deb [signed-by=/usr/share/keyrings/nvidia-container-toolkit-keyring.gpg] https://#g' \
      | tee /etc/apt/sources.list.d/nvidia-container-toolkit.list
    apt-get update -y
    apt-get install -y nvidia-container-toolkit
    nvidia-ctk runtime configure --runtime=docker

  # Enable Compose service — starts automatically after reboot
  - systemctl daemon-reload
  - systemctl enable vllm-qwen-image

power_state:
  mode: reboot
  message: "Rebooting to load NVIDIA drivers — vLLM-Omni will start on next boot"
  timeout: 1

final_message: |
  NVIDIA drivers installed. Rebooting to load the kernel module.
  After reboot, vLLM-Omni downloads Qwen/Qwen-Image-2.1 (about 33 GB).
  Browser:   http://<server-ip>:3000
  Image API: http://<server-ip>:8000/v1/images/generations
