#cloud-config
# Hermes Agent (NousResearch) on Rocky Linux
#
# Installs Hermes Agent via the official installer in headless/server mode.
# Skips browser automation (no desktop required on a server).
# After boot, run `hermes setup` to configure your LLM provider and channels.
#
# Hermes docs: https://hermes-agent.nousresearch.com
# GitHub: https://github.com/NousResearch/hermes-agent
#
# After boot:
#   ssh rocky@<server-ip>
#   hermes setup
#
# Required security group ports:
#   - 22  (SSH — management)
#
# Recommended specs: 2 vCPU / 4 GB RAM minimum
# Tested on: Rocky Linux 10

bootcmd:
  - |
    set -eu
    mirror_root='https://mirror.gozunga.com/rocky-linux'
    for f in /etc/yum.repos.d/rocky*.repo /etc/yum.repos.d/Rocky*.repo; do
      [ -f "$f" ] || continue
      sed -i -e 's/^[[:space:]]*mirrorlist=/# mirrorlist=/' \
             -e 's/^[[:space:]]*metalink=/# metalink=/' "$f"
      sed -i -e 's/^[[:space:]]*#[[:space:]]*baseurl=/baseurl=/' "$f"
      sed -i -e 's|https\?://[^/]*rockylinux\.org/\$contentdir|'"${mirror_root}"'|g' \
             -e 's|https\?://[^/]*rockylinux\.org/pub/rocky|'"${mirror_root}"'|g' \
             -e 's|https\?://dl\.rockylinux\.org/\$contentdir|'"${mirror_root}"'|g' "$f"
    done

package_update: true
package_upgrade: true

packages:
  - curl
  - ca-certificates
  - git
  - xz

runcmd:
  - |
    set -e

    # Install Hermes Agent via official installer, skip browser automation
    curl -fsSL https://hermes-agent.nousresearch.com/install.sh \
      | bash -s -- --skip-browser

    # Make hermes available system-wide
    ln -sf /usr/local/lib/hermes-agent/venv/bin/hermes /usr/local/bin/hermes 2>/dev/null || \
    ln -sf /root/.local/bin/hermes /usr/local/bin/hermes 2>/dev/null || \
    ln -sf /root/.hermes/hermes-agent/venv/bin/hermes /usr/local/bin/hermes 2>/dev/null || true

    cat >> /etc/motd <<'EOF'

    ╔══════════════════════════════════════════════════════╗
    ║          Hermes Agent installed successfully         ║
    ╠══════════════════════════════════════════════════════╣
    ║  To configure your LLM provider:                     ║
    ║    hermes setup                                      ║
    ║                                                      ║
    ║  Or quick setup with Nous Portal:                    ║
    ║    hermes setup --portal                             ║
    ║                                                      ║
    ║  Verify installation:                                ║
    ║    hermes doctor                                     ║
    ╚══════════════════════════════════════════════════════╝

    EOF

final_message: |
  Hermes Agent installed after $UPTIME seconds.
  Run `hermes setup` to configure your LLM provider.
